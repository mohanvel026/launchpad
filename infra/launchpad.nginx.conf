# LaunchPad Nginx Config
# ALL traffic (dashboard + project subdomains) is forwarded to Node.js on port 5000
# Node.js handles routing internally via projectProxy.middleware.js

server {
    listen 80 default_server;
    server_name _;

    # Allow large uploads (repo webhooks etc)
    client_max_body_size 50M;

    # Timeouts
    proxy_connect_timeout  60s;
    proxy_send_timeout     60s;
    proxy_read_timeout    120s;

    # Socket.io needs special handling
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Everything else → Node.js
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
